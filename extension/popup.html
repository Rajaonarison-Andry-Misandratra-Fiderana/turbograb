<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TurboGrab</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <header class="head">
      <img src="icons/icon-48.png" alt="" width="24" height="24" />
      <strong>TurboGrab</strong>
      <span id="status" class="pill">…</span>
    </header>

    <label class="row" style="padding-left: 0; padding-right: 0; border: 0">
      <span><strong>Intercept downloads</strong></span>
      <input type="checkbox" id="enabled" />
    </label>

    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>Nothing downloading.</p>

    <div class="actions" style="margin-top: 12px">
      <button id="options">Options</button>
    </div>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
